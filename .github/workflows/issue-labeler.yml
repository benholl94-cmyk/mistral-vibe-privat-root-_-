name: Issue Labeler

on:
    issues:
        types: [opened]

jobs:
    label-issues:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Parse bug report form
              id: parse-bug
              uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3.2.5
              with:
                  template-path: .github/ISSUE_TEMPLATE/bug-report.yml
              continue-on-error: true

            - name: Parse feature request form
              id: parse-feature
              uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3.2.5
              with:
                  template-path: .github/ISSUE_TEMPLATE/feature-request.yml
              continue-on-error: true

            - name: Apply labels based on template
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  BUG_COMPONENT: ${{ steps.parse-bug.outputs.issueparser_component }}
                  BUG_SEVERITY: ${{ steps.parse-bug.outputs.issueparser_severity }}
                  FEATURE_COMPONENT: ${{ steps.parse-feature.outputs.issueparser_component }}
                  FEATURE_PRIORITY: ${{ steps.parse-feature.outputs.issueparser_priority }}
                  ISSUE_TITLE: ${{ github.event.issue.title }}
              with:
                  script: |
                      const { BUG_COMPONENT, BUG_SEVERITY, FEATURE_COMPONENT, FEATURE_PRIORITY, ISSUE_TITLE } = process.env;

                      // Determine if this is a bug or feature based on title or template
                      const isBug = ISSUE_TITLE.includes('[BUG]') || BUG_COMPONENT;
                      const isFeature = ISSUE_TITLE.includes('[FEAT]') || FEATURE_COMPONENT;

                      const labels = [];

                      // Component labels
                      const component = BUG_COMPONENT || FEATURE_COMPONENT;
                      if (component) {
                          const componentLabels = new Map([
                              ['CLI (Textual TUI)', 'CLI'],
                              ['ACP (Agent Client Protocol)', 'ACP'],
                              ['VS Code Extension', 'VS Code extension'],
                              ['Core Engine', 'core'],
                              ['Agent Loop', 'agent-loop'],
                              ['Tools System', 'tools'],
                              ['Configuration', 'config'],
                              ['Authentication', 'auth'],
                              ['Sessions', 'sessions'],
                              ['Build/Packaging', 'build'],
                              ['Documentation', 'docs'],
                              ['Other (specify below)', 'needs-triage'],
                          ]);
                          const label = componentLabels.get(component);
                          if (label) {
                              labels.push(label);
                          }
                      }

                      // Type labels
                      if (isBug) {
                          labels.push('bug');
                          // Add severity label if available
                          if (BUG_SEVERITY) {
                              const severityMap = new Map([
                                  ['P0 - Critical (blocks core functionality, data loss)', 'severity/critical'],
                                  ['P1 - High (major feature broken, workaround difficult)', 'severity/high'],
                                  ['P2 - Medium (partial functionality affected, workaround exists)', 'severity/medium'],
                                  ['P3 - Low (cosmetic, minor inconvenience)', 'severity/low'],
                              ]);
                              const severityLabel = severityMap.get(BUG_SEVERITY);
                              if (severityLabel) {
                                  labels.push(severityLabel);
                              }
                          }
                      }

                      if (isFeature) {
                          labels.push('enhancement');
                          // Add priority label if available
                          if (FEATURE_PRIORITY) {
                              const priorityMap = new Map([
                                  ['P0 - Blocking (cannot use Vibe without this)', 'priority/critical'],
                                  ['P1 - High (significant productivity impact)', 'priority/high'],
                                  ['P2 - Medium (nice to have, moderate impact)', 'priority/medium'],
                                  ['P3 - Low (minor convenience improvement)', 'priority/low'],
                              ]);
                              const priorityLabel = priorityMap.get(FEATURE_PRIORITY);
                              if (priorityLabel) {
                                  labels.push(priorityLabel);
                              }
                          }
                      }

                      // Always add triage label if no labels were added
                      if (labels.length === 0) {
                          labels.push('triage-needed');
                      }

                      if (labels.length > 0) {
                          await github.rest.issues.addLabels({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: context.issue.number,
                              labels: labels,
                          });
                          console.log(`Added labels: ${labels.join(', ')}`);
                      } else {
                          console.log('No labels to add');
                      }
